<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; }
      .hero-shadow { filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.4)); }
    </style>
  </defs>
  <!-- Background Dark Canvas -->
  <rect width="375" height="812" fill="#020617" />
  
  <!-- Mobile Room Header -->
  <g transform="translate(16, 16)">
    <rect width="343" height="52" rx="12" fill="#0F172A" />
    <g transform="translate(12, 12)">
      <rect width="28" height="28" rx="7" fill="#2563EB" />
      <path d="M8 14L11 17L20 8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="36" y="18" class="font-sans" font-size="13" font-weight="800" fill="#FFFFFF">Bridgeway<tspan fill="#38BDF8">Meet</tspan></text>
    </g>
    <!-- Leave Button -->
    <g transform="translate(250, 10)">
      <rect width="80" height="32" rx="8" fill="#DC2626" />
      <text x="40" y="21" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Leave ✕</text>
    </g>
  </g>

  <!-- Live Call Status -->
  <g transform="translate(16, 76)">
    <text x="0" y="15" class="font-sans" font-size="14" font-weight="800" fill="#FFFFFF">Sprint Planning &amp; Review</text>
    <circle cx="4" cy="28" r="4" fill="#10B981" />
    <text x="16" y="32" class="font-sans" font-size="11" font-weight="600" fill="#34D399">LIVE • 00:24:18</text>
    <text x="120" y="32" class="font-sans" font-size="11" fill="#94A3B8">🔒 Jitsi Bridge (4 in call)</text>
  </g>

  <!-- Main Active Video Area -->
  <g transform="translate(16, 120)">
    <rect width="343" height="460" rx="16" fill="#0B132B" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Slide in Jitsi feed -->
    <g transform="translate(20, 30)">
      <text x="0" y="20" class="font-sans" font-size="16" font-weight="800" fill="#FFFFFF">Sprint 4 Architecture</text>
      <text x="0" y="40" class="font-sans" font-size="11" fill="#38BDF8">Bridgeway HR Core Engine</text>
      
      <!-- Schematic diagram -->
      <rect y="60" width="303" height="180" rx="10" fill="#1E293B" stroke="#334155" />
      <rect x="20" y="80" width="110" height="60" rx="8" fill="#0F172A" stroke="#2563EB" />
      <text x="75" y="115" class="font-sans" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Auth Router</text>
      
      <rect x="170" y="80" width="110" height="60" rx="8" fill="#0F172A" stroke="#10B981" />
      <text x="225" y="115" class="font-sans" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Task Board</text>
    </g>

    <!-- Presenter Label -->
    <g transform="translate(16, 410)">
      <rect width="180" height="30" rx="6" fill="#020617" opacity="0.85" />
      <circle cx="15" cy="15" r="8" fill="#2563EB" />
      <text x="15" y="19" class="font-sans" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">AV</text>
      <text x="30" y="20" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF">Alex Vance (Presenting)</text>
    </g>

    <!-- Floating Picture-in-Picture (PiP) Tile: Sarah Jenkins -->
    <g transform="translate(225, 330)">
      <rect width="105" height="110" rx="10" fill="#0F172A" stroke="#2563EB" stroke-width="2" />
      <circle cx="52" cy="45" r="22" fill="#2563EB" />
      <text x="52" y="52" class="font-sans" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">SJ</text>
      <rect x="6" y="80" width="93" height="20" rx="4" fill="#020617" opacity="0.85" />
      <text x="52" y="94" class="font-sans" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sarah (You) 🎙</text>
    </g>
  </g>

  <!-- Participant Strip -->
  <g transform="translate(16, 600)">
    <!-- David Miller Tile -->
    <rect width="165" height="70" rx="10" fill="#0F172A" stroke="#334155" />
    <circle cx="28" cy="35" r="16" fill="#4F46E5" />
    <text x="28" y="40" class="font-sans" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">DM</text>
    <text x="52" y="32" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF">David Miller</text>
    <text x="52" y="48" class="font-sans" font-size="10" fill="#94A3B8">Design &amp; UX</text>

    <!-- Michael Scott Tile -->
    <g transform="translate(178, 0)">
      <rect width="165" height="70" rx="10" fill="#0F172A" stroke="#334155" />
      <circle cx="28" cy="35" r="16" fill="#059669" />
      <text x="28" y="40" class="font-sans" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">MS</text>
      <text x="52" y="32" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF">Michael Scott</text>
      <text x="52" y="48" class="font-sans" font-size="10" fill="#94A3B8">Sales</text>
    </g>
  </g>

  <!-- Floating Mobile Controls Bar -->
  <g transform="translate(16, 695)">
    <rect width="343" height="54" rx="27" fill="#0F172A" stroke="#334155" class="hero-shadow" />
    <circle cx="45" cy="27" r="18" fill="#1E293B" />
    <text x="45" y="32" class="font-sans" font-size="14" fill="#FFFFFF" text-anchor="middle">🎙</text>
    <circle cx="105" cy="27" r="18" fill="#1E293B" />
    <text x="105" y="32" class="font-sans" font-size="14" fill="#FFFFFF" text-anchor="middle">📹</text>
    <circle cx="165" cy="27" r="18" fill="#2563EB" />
    <text x="165" y="32" class="font-sans" font-size="14" fill="#FFFFFF" text-anchor="middle">💬</text>
    <circle cx="225" cy="27" r="18" fill="#1E293B" />
    <text x="225" y="32" class="font-sans" font-size="14" fill="#FFFFFF" text-anchor="middle">✋</text>
    <!-- End call button -->
    <g transform="translate(265, 12)">
      <rect width="65" height="30" rx="15" fill="#DC2626" />
      <text x="32" y="20" class="font-sans" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">End</text>
    </g>
  </g>
</svg>