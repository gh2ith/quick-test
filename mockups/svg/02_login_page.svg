<svg width="1440" height="1000" viewBox="0 0 1440 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .card-shadow { filter: drop-shadow(0 10px 25px rgba(15, 23, 42, 0.05)) drop-shadow(0 1px 3px rgba(15, 23, 42, 0.04)); }
      .hero-shadow { filter: drop-shadow(0 20px 40px rgba(15, 23, 42, 0.08)) drop-shadow(0 2px 5px rgba(15, 23, 42, 0.04)); }
      .btn-shadow { filter: drop-shadow(0 4px 14px rgba(37, 99, 235, 0.28)); }
    </style>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1440" height="1000" fill="#F8FAFC" />
  <circle cx="150" cy="180" r="280" fill="#2563EB" opacity="0.03" />
  <circle cx="1290" cy="240" r="320" fill="#6366F1" opacity="0.03" />
  <!-- ==================== TASK 1: LOCKED NAVBAR (GUEST) ==================== -->
  <g id="Navbar-Guest" transform="translate(150, 24)">
    <rect width="1140" height="70" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" class="card-shadow" />
    
    <!-- Logo: Bridgeway HR -->
    <g transform="translate(24, 17)">
      <rect width="36" height="36" rx="9" fill="#2563EB" />
      <path d="M10 18L15 23L26 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="25" class="font-sans" font-size="19" font-weight="800" fill="#0F172A">Bridgeway<tspan fill="#2563EB">HR</tspan></text>
    </g>
    <g transform="translate(450, 26)">
      <text x="0" y="15" class="font-sans" font-size="14" font-weight="700" fill="#2563EB">Home</text>
      <circle cx="20" cy="25" r="2.5" fill="#2563EB" />
      <text x="85" y="15" class="font-sans" font-size="14" font-weight="500" fill="#475569">About</text>
      <text x="170" y="15" class="font-sans" font-size="14" font-weight="500" fill="#475569">Contact Us</text>
    </g>
    <g transform="translate(995, 15)">
      <rect width="120" height="40" rx="10" fill="#2563EB" class="btn-shadow"/>
      <text x="60" y="21" class="font-sans" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Login →</text>
    </g>
  </g>
  <!-- Split-Screen Login Card (Character on Left, Form on Right) -->
  <g transform="translate(240, 115)">
    <!-- Container Card Shadow -->
    <rect width="960" height="540" rx="24" fill="#FFFFFF" stroke="#E2E8F0" class="hero-shadow" />
    
    <!-- LEFT PANEL: HR Security Assistant Character Stage -->
    <g id="Left-Panel-Character">
      <!-- Background Clip -->
      <path d="M0 24 C0 10.745, 10.745 0, 24 0 L440 0 L440 540 L24 540 C10.745 540, 0 529.255, 0 516 Z" fill="url(#pill-grad)" />
      <line x1="440" y1="0" x2="440" y2="540" stroke="#BFDBFE" stroke-width="1" />

      <!-- Watermark Shield -->
      <path d="M220 80 C270 80, 310 100, 310 160 C310 240, 220 300, 220 300 C220 300, 130 240, 130 160 C130 100, 170 80, 220 80 Z" stroke="#2563EB" stroke-width="3" fill="none" opacity="0.06" />

      <!-- Speech Bubble -->
      <g transform="translate(90, 35)">
        <rect width="260" height="34" rx="17" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
        <circle cx="18" cy="17" r="4" fill="#2563EB" />
        <text x="32" y="21" class="font-sans" font-size="11" font-weight="700" fill="#1D4ED8">🔒 "I'm looking away! Password is private."</text>
      </g>

      <!-- Assistant Character Illustration (Covering Eyes State) -->
      <g transform="translate(95, 85)">
        <!-- Floor Shadow -->
        <ellipse cx="125" cy="270" rx="75" ry="8" fill="rgba(15, 23, 42, 0.08)" />

        <!-- Torso & Suit -->
        <path d="M50 270 C50 205, 80 190, 125 190 C170 190, 200 205, 200 270 Z" fill="#1E293B" />
        <path d="M100 190 L125 240 L150 190 Z" fill="#EFF6FF" />
        <path d="M120 200 L130 200 L134 255 L125 265 L116 255 Z" fill="#2563EB" />
        <!-- Badge -->
        <rect x="114" y="240" width="22" height="30" rx="3" fill="#FFFFFF" stroke="#CBD5E1" />
        <rect x="117" y="243" width="16" height="5" rx="1" fill="#2563EB" />
        <circle cx="125" cy="254" r="4" fill="#94A3B8" />

        <!-- Head -->
        <rect x="112" y="160" width="26" height="35" rx="6" fill="#FCD34D" />
        <circle cx="75" cy="120" r="11" fill="#FCD34D" />
        <circle cx="175" cy="120" r="11" fill="#FCD34D" />
        <rect x="76" y="65" width="98" height="110" rx="49" fill="#FDE047" />

        <!-- Hair -->
        <path d="M72 90 C70 55, 100 45, 125 45 C155 45, 180 58, 178 90 C170 75, 155 70, 138 70 C114 70, 94 78, 72 90 Z" fill="#1E293B" />

        <!-- Eyes (Peeking slightly) -->
        <ellipse cx="102" cy="118" rx="11" ry="13" fill="#FFFFFF" stroke="#CBD5E1" />
        <circle cx="104" cy="118" r="6" fill="#0F172A" />
        <ellipse cx="148" cy="118" rx="11" ry="13" fill="#FFFFFF" stroke="#CBD5E1" />
        <circle cx="146" cy="118" r="6" fill="#0F172A" />

        <!-- Hands Covering Eyes (The Signature Privacy Gesture) -->
        <g id="HandsCovering">
          <!-- Left Sleeve & Hand -->
          <path d="M50 240 C50 190, 72 160, 92 138" stroke="#1E293B" stroke-width="20" stroke-linecap="round" fill="none" />
          <g transform="translate(82, 104)">
            <rect width="38" height="28" rx="14" fill="#FDE047" stroke="#D97706" stroke-width="1.5" />
            <path d="M8 8 Q18 6 30 10" stroke="#D97706" stroke-width="1.5" fill="none" />
            <path d="M6 16 Q18 14 30 18" stroke="#D97706" stroke-width="1.5" fill="none" />
          </g>
          <!-- Right Sleeve & Hand -->
          <path d="M200 240 C200 190, 178 160, 158 138" stroke="#1E293B" stroke-width="20" stroke-linecap="round" fill="none" />
          <g transform="translate(130, 104)">
            <rect width="38" height="28" rx="14" fill="#FDE047" stroke="#D97706" stroke-width="1.5" />
            <path d="M8 10 Q20 6 30 8" stroke="#D97706" stroke-width="1.5" fill="none" />
            <path d="M8 18 Q20 14 30 16" stroke="#D97706" stroke-width="1.5" fill="none" />
          </g>
        </g>

        <!-- Smile / Surprised Mouth -->
        <circle cx="125" cy="150" r="4" fill="#B45309" />
      </g>

      <!-- Assistant Desk ID Card -->
      <g transform="translate(45, 455)">
        <rect width="350" height="50" rx="12" fill="#FFFFFF" stroke="#BFDBFE" />
        <rect x="14" y="10" width="30" height="30" rx="8" fill="#2563EB" />
        <text x="29" y="30" class="font-sans" font-size="14" fill="#FFFFFF" text-anchor="middle">🛡</text>
        <text x="56" y="24" class="font-sans" font-size="12" font-weight="700" fill="#0F172A">Sam • Security &amp; Privacy Guardian</text>
        <text x="56" y="38" class="font-sans" font-size="10" font-weight="500" fill="#64748B">Reacts dynamically to user cursor &amp; password focus</text>
        <rect x="265" y="15" width="70" height="20" rx="10" fill="#ECFDF5" stroke="#A7F3D0" />
        <text x="300" y="28" class="font-sans" font-size="9" font-weight="800" fill="#059669" text-anchor="middle">● PRIVACY</text>
      </g>
    </g>

    <!-- RIGHT PANEL: Authentication Form -->
    <g transform="translate(475, 40)">
      <!-- Logo + Header -->
      <rect width="38" height="38" rx="9" fill="#2563EB" />
      <path d="M11 19L16 24L27 13" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="25" class="font-sans" font-size="20" font-weight="800" fill="#0F172A">Bridgeway<tspan fill="#2563EB">HR</tspan></text>
      
      <text x="0" y="72" class="font-sans" font-size="22" font-weight="800" fill="#0F172A">Sign In to Your Workspace</text>
      <text x="0" y="94" class="font-sans" font-size="13" font-weight="400" fill="#64748B">Enter your official employee or administrator credentials</text>

      <!-- Role-Routing Notice -->
      <rect x="0" y="112" width="440" height="32" rx="8" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="14" y="132" class="font-sans" font-size="11" font-weight="600" fill="#1D4ED8">ℹ System auto-detects user role upon login and redirects to console.</text>

      <!-- Email Field -->
      <text x="0" y="172" class="font-sans" font-size="12" font-weight="700" fill="#334155">Work Email Address</text>
      <rect x="0" y="182" width="440" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="14" y="209" class="font-sans" font-size="13" fill="#0F172A">sarah.jenkins@bridgeway.corp</text>

      <!-- Password Field with Show/Hide Eye -->
      <text x="0" y="252" class="font-sans" font-size="12" font-weight="700" fill="#334155">Password (Private)</text>
      <rect x="0" y="262" width="440" height="44" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
      <text x="14" y="291" class="font-sans" font-size="16" fill="#0F172A" letter-spacing="2">••••••••••••</text>
      <!-- Show/Hide Icon -->
      <circle cx="415" cy="284" r="14" fill="#F1F5F9" />
      <text x="415" y="289" class="font-sans" font-size="13" fill="#64748B" text-anchor="middle">👁</text>

      <!-- Sign In Button -->
      <rect x="0" y="325" width="440" height="46" rx="10" fill="#2563EB" class="btn-shadow" />
      <text x="220" y="353" class="font-sans" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sign In to Portal →</text>

      <!-- HR Security Footnote -->
      <g transform="translate(0, 395)">
        <rect width="440" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="220" y="23" class="font-sans" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">
          🔒 Zero public registration. All user accounts are provisioned exclusively by HR.
        </text>
      </g>
    </g>
  </g>
  <!-- ==================== GLOBAL FOOTER (GUEST) ==================== -->
  <g id="Footer" transform="translate(150, 680)">
    <rect width="1140" height="350" rx="24" fill="#0F172A" />
    
    <!-- Left Column: HQ Details & Map Box -->
    <g transform="translate(40, 36)">
      <text x="0" y="20" class="font-sans" font-size="20" font-weight="800" fill="#FFFFFF">Bridgeway<tspan fill="#3B82F6">HR</tspan></text>
      <text x="0" y="52" class="font-sans" font-size="13" font-weight="400" fill="#94A3B8">King Hussein Business Park • Building 23</text>
      <text x="0" y="72" class="font-sans" font-size="13" font-weight="400" fill="#94A3B8">Amman 11831, Jordan</text>
      <text x="0" y="100" class="font-sans" font-size="13" font-weight="600" fill="#60A5FA">📞 +962 6 550 4400</text>
      <text x="0" y="120" class="font-sans" font-size="13" font-weight="600" fill="#60A5FA">✉ hr-ops@bridgeway.corp</text>
      
      <!-- Mini Map Box -->
      <g transform="translate(0, 142)">
        <rect width="280" height="70" rx="10" fill="#1E293B" stroke="#334155" />
        <text x="16" y="28" class="font-sans" font-size="12" font-weight="700" fill="#FFFFFF">📍 Amman Innovation HQ Map</text>
        <text x="16" y="48" class="font-sans" font-size="11" font-weight="400" fill="#38BDF8">View on Google Maps ↗ (31.9753° N, 35.8344° E)</text>
      </g>
    </g>

    <!-- Center Navigation Links -->
    <g transform="translate(420, 36)">
      <text x="0" y="20" class="font-sans" font-size="14" font-weight="700" fill="#FFFFFF">Quick Navigation</text>
      <text x="0" y="52" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">Home</text>
      <text x="0" y="77" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">About Bridgeway</text>
      <text x="0" y="102" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">Contact &amp; Inquiries</text>
      <text x="0" y="127" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">Company Policies</text>
      <text x="0" y="152" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">Meetings Portal (Jitsi)</text>
    </g>
    <!-- Right Column: Contact / Feedback Form (Subject Field Included) -->
    <g transform="translate(680, 26)">
      <rect width="420" height="295" rx="16" fill="#1E293B" stroke="#334155" />
      <text x="24" y="28" class="font-sans" font-size="14" font-weight="700" fill="#FFFFFF">Send Feedback to HR</text>
      <text x="24" y="46" class="font-sans" font-size="11" font-weight="400" fill="#94A3B8">Direct inquiry conduit to People Operations</text>
      
      <rect x="24" y="60" width="180" height="34" rx="8" fill="#0F172A" stroke="#334155" />
      <text x="36" y="81" class="font-sans" font-size="11" fill="#64748B">Your Name</text>
      <rect x="216" y="60" width="180" height="34" rx="8" fill="#0F172A" stroke="#334155" />
      <text x="228" y="81" class="font-sans" font-size="11" fill="#64748B">Work Email</text>
      
      <rect x="24" y="104" width="372" height="34" rx="8" fill="#0F172A" stroke="#334155" />
      <text x="36" y="125" class="font-sans" font-size="11" fill="#64748B">Subject (e.g. Leave Inquiry, Technical Suggestion)</text>
      
      <rect x="24" y="148" width="372" height="74" rx="8" fill="#0F172A" stroke="#334155" />
      <text x="36" y="170" class="font-sans" font-size="11" fill="#64748B">Write your confidential feedback here...</text>
      
      <rect x="24" y="234" width="372" height="36" rx="8" fill="#2563EB" />
      <text x="210" y="257" class="font-sans" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Submit Feedback to HR →</text>
    </g>
    <line x1="40" y1="305" x2="1100" y2="305" stroke="#1E293B" stroke-width="1" />
    <text x="40" y="330" class="font-sans" font-size="12" font-weight="500" fill="#64748B">© 2026 Bridgeway HR Management System • Project Deliverable</text>
    <text x="1100" y="330" class="font-sans" font-size="12" font-weight="500" fill="#64748B" text-anchor="end">Amman, Jordan</text>
  </g>
</svg>