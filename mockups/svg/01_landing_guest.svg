<svg width="1440" height="1850" viewBox="0 0 1440 1850" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .card-shadow { filter: drop-shadow(0 10px 25px rgba(15, 23, 42, 0.05)) drop-shadow(0 1px 3px rgba(15, 23, 42, 0.04)); }
      .hero-shadow { filter: drop-shadow(0 20px 40px rgba(15, 23, 42, 0.08)) drop-shadow(0 2px 5px rgba(15, 23, 42, 0.04)); }
      .btn-shadow { filter: drop-shadow(0 4px 14px rgba(37, 99, 235, 0.28)); }
    </style>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1440" height="1850" fill="#F8FAFC" />
  <circle cx="150" cy="180" r="280" fill="#2563EB" opacity="0.03" />
  <circle cx="1290" cy="240" r="320" fill="#6366F1" opacity="0.03" />
  <!-- ==================== TASK 1: LOCKED NAVBAR (GUEST) ==================== -->
  <g id="Navbar-Guest" transform="translate(150, 24)">
    <rect width="1140" height="70" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" class="card-shadow" />
    
    <!-- Logo: Bridgeway HR -->
    <g transform="translate(24, 17)">
      <rect width="36" height="36" rx="9" fill="#2563EB" />
      <path d="M10 18L15 23L26 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="25" class="font-sans" font-size="19" font-weight="800" fill="#0F172A">Bridgeway<tspan fill="#2563EB">HR</tspan></text>
    </g>
    <g transform="translate(450, 26)">
      <text x="0" y="15" class="font-sans" font-size="14" font-weight="700" fill="#2563EB">Home</text>
      <circle cx="20" cy="25" r="2.5" fill="#2563EB" />
      <text x="85" y="15" class="font-sans" font-size="14" font-weight="500" fill="#475569">About</text>
      <text x="170" y="15" class="font-sans" font-size="14" font-weight="500" fill="#475569">Contact Us</text>
    </g>
    <g transform="translate(995, 15)">
      <rect width="120" height="40" rx="10" fill="#2563EB" class="btn-shadow"/>
      <text x="60" y="21" class="font-sans" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Login →</text>
    </g>
  </g>
  <!-- Hero Section -->
  <g transform="translate(150, 130)">
    <g transform="translate(370, 0)">
      <rect width="400" height="34" rx="17" fill="url(#pill-grad)" stroke="#BFDBFE" stroke-width="1" />
      <circle cx="20" cy="17" r="4.5" fill="#2563EB" />
      <text x="34" y="18" class="font-sans" font-size="12" font-weight="700" fill="#1D4ED8" dominant-baseline="central">Bridgeway HR • Modern People Operations Platform</text>
    </g>
    <text x="570" y="80" class="font-sans" font-size="44" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="-1">The Complete Operating System for Modern Teams</text>
    <text x="570" y="118" class="font-sans" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">
      <tspan x="570" dy="0">Empowering employees, automating HR workflows, managing tasks,</tspan>
      <tspan x="570" dy="22">and tracking leave applications with enterprise precision.</tspan>
    </text>
    <g transform="translate(435, 168)">
      <rect width="130" height="46" rx="12" fill="#2563EB" class="btn-shadow"/>
      <text x="65" y="24" class="font-sans" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Login to Portal →</text>
      <rect x="145" width="130" height="46" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="210" y="24" class="font-sans" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">About Platform</text>
    </g>
    <!-- Live Operational Preview Card (Stored Data Only, No Fake Stats!) -->
    <g transform="translate(130, 245)">
      <rect width="880" height="180" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" class="hero-shadow" />
      <g transform="translate(30, 30)">
        <rect width="250" height="120" rx="14" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="20" y="32" class="font-sans" font-size="12" font-weight="700" fill="#64748B">LEAVE APPLICATIONS</text>
        <text x="20" y="65" class="font-sans" font-size="28" font-weight="800" fill="#0F172A">4 Pending</text>
        <text x="20" y="90" class="font-sans" font-size="11" font-weight="500" fill="#10B981">● Approvals Queue Active</text>
      </g>
      <g transform="translate(315, 30)">
        <rect width="250" height="120" rx="14" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="20" y="32" class="font-sans" font-size="12" font-weight="700" fill="#64748B">ENGINEERING SPRINT</text>
        <text x="20" y="65" class="font-sans" font-size="28" font-weight="800" fill="#0F172A">6 Tasks</text>
        <text x="20" y="90" class="font-sans" font-size="11" font-weight="500" fill="#3B82F6">● 4 In Progress, 2 Submitted</text>
      </g>
      <g transform="translate(600, 30)">
        <rect width="250" height="120" rx="14" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="20" y="32" class="font-sans" font-size="12" font-weight="700" fill="#64748B">COMPANY COMPLIANCE</text>
        <text x="20" y="65" class="font-sans" font-size="28" font-weight="800" fill="#0F172A">5 Policies</text>
        <text x="20" y="90" class="font-sans" font-size="11" font-weight="500" fill="#6366F1">● Read-Only JSON Rulebook</text>
      </g>
    </g>
  </g>

  <!-- Services Grid (6 Core Cards) -->
  <g transform="translate(150, 600)">
    <text x="570" y="40" class="font-sans" font-size="28" font-weight="800" fill="#0F172A" text-anchor="middle">Integrated Workforce Modules</text>
    <text x="570" y="68" class="font-sans" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">Every workflow required for agile engineering and personnel administration</text>
    
    <!-- Row 1 -->
    <g transform="translate(0, 100)">
      <rect width="360" height="160" rx="16" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow"/>
      <rect x="24" y="24" width="40" height="40" rx="10" fill="#EFF6FF" />
      <text x="44" y="49" class="font-sans" font-size="18" fill="#2563EB" text-anchor="middle">👥</text>
      <text x="24" y="92" class="font-sans" font-size="16" font-weight="700" fill="#0F172A">Employee Directory</text>
      <text x="24" y="115" class="font-sans" font-size="12" fill="#64748B">Centralized staff records, roles, positions, and department filters.</text>
    </g>
    <g transform="translate(390, 100)">
      <rect width="360" height="160" rx="16" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow"/>
      <rect x="24" y="24" width="40" height="40" rx="10" fill="#FFFBEB" />
      <text x="44" y="49" class="font-sans" font-size="18" fill="#D97706" text-anchor="middle">📋</text>
      <text x="24" y="92" class="font-sans" font-size="16" font-weight="700" fill="#0F172A">Task Management</text>
      <text x="24" y="115" class="font-sans" font-size="12" fill="#64748B">Sprint delegation, priorities, deliverable submission, and review loop.</text>
    </g>
    <g transform="translate(780, 100)">
      <rect width="360" height="160" rx="16" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow"/>
      <rect x="24" y="24" width="40" height="40" rx="10" fill="#ECFDF5" />
      <text x="44" y="49" class="font-sans" font-size="18" fill="#059669" text-anchor="middle">🏖</text>
      <text x="24" y="92" class="font-sans" font-size="16" font-weight="700" fill="#0F172A">Leave Requests</text>
      <text x="24" y="115" class="font-sans" font-size="12" fill="#64748B">Annual, sick, and departure applications with instant approval tracking.</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 280)">
      <rect width="360" height="160" rx="16" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow"/>
      <rect x="24" y="24" width="40" height="40" rx="10" fill="#EFF6FF" />
      <text x="44" y="49" class="font-sans" font-size="18" fill="#2563EB" text-anchor="middle">📖</text>
      <text x="24" y="92" class="font-sans" font-size="16" font-weight="700" fill="#0F172A">Company Policies</text>
      <text x="24" y="115" class="font-sans" font-size="12" fill="#64748B">Static JSON handbook covering code of conduct, remote work, and ethics.</text>
    </g>
    <g transform="translate(390, 280)">
      <rect width="360" height="160" rx="16" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow"/>
      <rect x="24" y="24" width="40" height="40" rx="10" fill="#FEF2F2" />
      <text x="44" y="49" class="font-sans" font-size="18" fill="#DC2626" text-anchor="middle">💬</text>
      <text x="24" y="92" class="font-sans" font-size="16" font-weight="700" fill="#0F172A">Confidential Feedback</text>
      <text x="24" y="115" class="font-sans" font-size="12" fill="#64748B">Direct inquiry and workplace suggestion conduit to People Operations.</text>
    </g>
    <g transform="translate(780, 280)">
      <rect width="360" height="160" rx="16" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow"/>
      <rect x="24" y="24" width="40" height="40" rx="10" fill="#EEF2FF" />
      <text x="44" y="49" class="font-sans" font-size="18" fill="#4F46E5" text-anchor="middle">📹</text>
      <text x="24" y="92" class="font-sans" font-size="16" font-weight="700" fill="#0F172A">Jitsi Video Meetings</text>
      <text x="24" y="115" class="font-sans" font-size="12" fill="#64748B">Embedded video conference room provided by trainer for team syncs.</text>
    </g>
  </g>

  <!-- About Summary Banner (Shared with all Home variants) -->
  <g transform="translate(150, 1080)">
    <rect width="1140" height="240" rx="20" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
    <g transform="translate(50, 40)">
      <text x="0" y="24" class="font-sans" font-size="22" font-weight="800" fill="#0F172A">About Bridgeway HR Platform</text>
      <text x="0" y="58" class="font-sans" font-size="14" font-weight="400" fill="#475569">
        <tspan x="0" dy="0">Bridgeway HR is a comprehensive, university-caliber people operations system designed to practice</tspan>
        <tspan x="0" dy="24">modern frontend techniques with HTML5, Bootstrap 5, vanilla JavaScript, and LocalStorage data models.</tspan>
      </text>
      <g transform="translate(0, 110)">
        <rect width="180" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="90" y="22" class="font-sans" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">Team Member 1 (Lead)</text>
        <rect x="195" width="180" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="285" y="22" class="font-sans" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">Team Member 2 (Frontend)</text>
        <rect x="390" width="180" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="480" y="22" class="font-sans" font-size="12" font-weight="700" fill="#D97706" text-anchor="middle">Team Member 3 (UI/UX)</text>
        <rect x="585" width="180" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="675" y="22" class="font-sans" font-size="12" font-weight="700" fill="#4F46E5" text-anchor="middle">Team Member 4 (Testing)</text>
      </g>
    </g>
  </g>
  <!-- ==================== GLOBAL FOOTER (GUEST) ==================== -->
  <g id="Footer" transform="translate(150, 1380)">
    <rect width="1140" height="350" rx="24" fill="#0F172A" />
    
    <!-- Left Column: HQ Details & Map Box -->
    <g transform="translate(40, 36)">
      <text x="0" y="20" class="font-sans" font-size="20" font-weight="800" fill="#FFFFFF">Bridgeway<tspan fill="#3B82F6">HR</tspan></text>
      <text x="0" y="52" class="font-sans" font-size="13" font-weight="400" fill="#94A3B8">King Hussein Business Park • Building 23</text>
      <text x="0" y="72" class="font-sans" font-size="13" font-weight="400" fill="#94A3B8">Amman 11831, Jordan</text>
      <text x="0" y="100" class="font-sans" font-size="13" font-weight="600" fill="#60A5FA">📞 +962 6 550 4400</text>
      <text x="0" y="120" class="font-sans" font-size="13" font-weight="600" fill="#60A5FA">✉ hr-ops@bridgeway.corp</text>
      
      <!-- Mini Map Box -->
      <g transform="translate(0, 142)">
        <rect width="280" height="70" rx="10" fill="#1E293B" stroke="#334155" />
        <text x="16" y="28" class="font-sans" font-size="12" font-weight="700" fill="#FFFFFF">📍 Amman Innovation HQ Map</text>
        <text x="16" y="48" class="font-sans" font-size="11" font-weight="400" fill="#38BDF8">View on Google Maps ↗ (31.9753° N, 35.8344° E)</text>
      </g>
    </g>

    <!-- Center Navigation Links -->
    <g transform="translate(420, 36)">
      <text x="0" y="20" class="font-sans" font-size="14" font-weight="700" fill="#FFFFFF">Quick Navigation</text>
      <text x="0" y="52" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">Home</text>
      <text x="0" y="77" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">About Bridgeway</text>
      <text x="0" y="102" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">Contact &amp; Inquiries</text>
      <text x="0" y="127" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">Company Policies</text>
      <text x="0" y="152" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">Meetings Portal (Jitsi)</text>
    </g>
    <!-- Right Column: Contact / Feedback Form (Subject Field Included) -->
    <g transform="translate(680, 26)">
      <rect width="420" height="295" rx="16" fill="#1E293B" stroke="#334155" />
      <text x="24" y="28" class="font-sans" font-size="14" font-weight="700" fill="#FFFFFF">Send Feedback to HR</text>
      <text x="24" y="46" class="font-sans" font-size="11" font-weight="400" fill="#94A3B8">Direct inquiry conduit to People Operations</text>
      
      <rect x="24" y="60" width="180" height="34" rx="8" fill="#0F172A" stroke="#334155" />
      <text x="36" y="81" class="font-sans" font-size="11" fill="#64748B">Your Name</text>
      <rect x="216" y="60" width="180" height="34" rx="8" fill="#0F172A" stroke="#334155" />
      <text x="228" y="81" class="font-sans" font-size="11" fill="#64748B">Work Email</text>
      
      <rect x="24" y="104" width="372" height="34" rx="8" fill="#0F172A" stroke="#334155" />
      <text x="36" y="125" class="font-sans" font-size="11" fill="#64748B">Subject (e.g. Leave Inquiry, Technical Suggestion)</text>
      
      <rect x="24" y="148" width="372" height="74" rx="8" fill="#0F172A" stroke="#334155" />
      <text x="36" y="170" class="font-sans" font-size="11" fill="#64748B">Write your confidential feedback here...</text>
      
      <rect x="24" y="234" width="372" height="36" rx="8" fill="#2563EB" />
      <text x="210" y="257" class="font-sans" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Submit Feedback to HR →</text>
    </g>
    <line x1="40" y1="305" x2="1100" y2="305" stroke="#1E293B" stroke-width="1" />
    <text x="40" y="330" class="font-sans" font-size="12" font-weight="500" fill="#64748B">© 2026 Bridgeway HR Management System • Project Deliverable</text>
    <text x="1100" y="330" class="font-sans" font-size="12" font-weight="500" fill="#64748B" text-anchor="end">Amman, Jordan</text>
  </g>
</svg>