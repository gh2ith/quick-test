      <text x="440" y="25" class="font-sans" font-size="12" font-weight="700" fill="#475569">ASSIGNED TO</text>
      <text x="610" y="25" class="font-sans" font-size="12" font-weight="700" fill="#475569">PRIORITY</text>
      <text x="730" y="25" class="font-sans" font-size="12" font-weight="700" fill="#475569">DUE DATE</text>
      <text x="850" y="25" class="font-sans" font-size="12" font-weight="700" fill="#475569">STATUS</text>
