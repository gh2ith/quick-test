  <circle cx="1290" cy="240" r="320" fill="#6366F1" opacity="0.03" />
  <!-- ==================== TASK 1: LOCKED NAVBAR (HR) ==================== -->
  <g id="Navbar-Hr" transform="translate(150, 24)">
