        <text x="20" y="32" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">TSK-101</text>
        <text x="110" y="32" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">Refactor Authentication State</text>
        <text x="440" y="32" class="font-sans" font-size="13" fill="#0F172A">Sarah Jenkins</text>
        <rect x="605" y="16" width="55" height="22" rx="11" fill="#FEE2E2" />
        <text x="632" y="31" class="font-sans" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">High</text>
        <text x="730" y="32" class="font-sans" font-size="13" fill="#64748B">05 Oct 2026</text>
        <rect x="840" y="16" width="80" height="22" rx="11" fill="#FEF3C7" />
        <text x="880" y="31" class="font-sans" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">In Progress</text>
        
