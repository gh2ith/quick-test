        <rect width="90" height="24" rx="12" fill="#DCFCE7" />
        <text x="45" y="16" class="font-sans" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">Completed</text>
        <rect x="100" width="80" height="24" rx="12" fill="#EFF6FF" />
        <text x="140" y="16" class="font-sans" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">Medium</text>
        <text x="195" y="17" class="font-sans" font-size="12" fill="#64748B">Due: 08 Oct 2026 • Approved by Alex Vance on 29 Sep 2026</text>
      </g>
      <text x="0" y="60" class="font-sans" font-size="20" font-weight="800" fill="#0F172A">TSK-102: Design System Tokens &amp; Component Alignment</text>
      <text x="0" y="85" class="font-sans" font-size="13" fill="#475569">
        Align all typography, button states, and modal components with the Bridgeway design language.
      </text>

      <g transform="translate(0, 115)">
        <rect width="1060" height="65" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="20" y="25" class="font-sans" font-size="12" font-weight="700" fill="#059669">✓ Solution Approved by HR:</text>
        <text x="20" y="48" class="font-sans" font-size="13" fill="#475569">"All design tokens, primary buttons, and card shadows match the locked specification perfectly."</text>
      </g>
    </g>
  </g>
  <!-- ==================== GLOBAL FOOTER (EMPLOYEE) ==================== -->
  <g id="Footer" transform="translate(150, 890)">
