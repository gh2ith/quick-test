<svg width="1440" height="1400" viewBox="0 0 1440 1400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .card-shadow { filter: drop-shadow(0 10px 25px rgba(15, 23, 42, 0.05)) drop-shadow(0 1px 3px rgba(15, 23, 42, 0.04)); }
      .hero-shadow { filter: drop-shadow(0 20px 40px rgba(15, 23, 42, 0.08)) drop-shadow(0 2px 5px rgba(15, 23, 42, 0.04)); }
      .btn-shadow { filter: drop-shadow(0 4px 14px rgba(37, 99, 235, 0.28)); }
    </style>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1440" height="1400" fill="#F8FAFC" />
  <circle cx="150" cy="180" r="280" fill="#2563EB" opacity="0.03" />
  <circle cx="1290" cy="240" r="320" fill="#6366F1" opacity="0.03" />
  <!-- ==================== TASK 1: LOCKED NAVBAR (EMPLOYEE) ==================== -->
  <g id="Navbar-Employee" transform="translate(150, 24)">
    <rect width="1140" height="70" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" class="card-shadow" />
    
    <!-- Logo: Bridgeway HR -->
    <g transform="translate(24, 17)">
      <rect width="36" height="36" rx="9" fill="#2563EB" />
      <path d="M10 18L15 23L26 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="25" class="font-sans" font-size="19" font-weight="800" fill="#0F172A">Bridgeway<tspan fill="#2563EB">HR</tspan></text>
    </g>
    <g transform="translate(250, 26)">
      <text x="0" y="15" class="font-sans" font-size="14" font-weight="500" fill="#475569">Home</text>
      <text x="75" y="15" class="font-sans" font-size="14" font-weight="500" fill="#475569">Profile</text>
      <text x="155" y="15" class="font-sans" font-size="14" font-weight="700" fill="#2563EB">Services ▾</text>
      <circle cx="177" cy="25" r="2.5" fill="#2563EB" />
      <text x="265" y="15" class="font-sans" font-size="14" font-weight="500" fill="#475569">About</text>
      <text x="345" y="15" class="font-sans" font-size="14" font-weight="500" fill="#475569">Contact Us</text>
    </g>
    <!-- Employee Profile Pill: Sarah Jenkins + Logout -->
    <g transform="translate(865, 14)">
      <rect width="255" height="42" rx="21" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="21" cy="21" r="16" fill="#2563EB" />
      <text x="21" y="25" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SJ</text>
      <text x="44" y="18" class="font-sans" font-size="12" font-weight="700" fill="#0F172A">Sarah Jenkins</text>
      <rect x="44" y="23" width="60" height="14" rx="7" fill="#EFF6FF" />
      <text x="74" y="33" class="font-sans" font-size="8" font-weight="700" fill="#2563EB" text-anchor="middle">EMPLOYEE</text>
      <g transform="translate(180, 7)">
        <rect width="65" height="28" rx="8" fill="#FEE2E2" />
        <text x="32" y="18" class="font-sans" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">Logout</text>
      </g>
    </g>
