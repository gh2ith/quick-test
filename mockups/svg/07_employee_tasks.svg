  <!-- Page Header -->
  <g transform="translate(150, 120)">
    <text x="0" y="30" class="font-sans" font-size="28" font-weight="800" fill="#0F172A">My Assigned Tasks</text>
    <text x="0" y="54" class="font-sans" font-size="14" font-weight="400" fill="#64748B">Tasks assigned to Sarah Jenkins (#EMP-2041) • Submit solutions to HR for review.</text>
  </g>

  <!-- Task 1: TSK-101 (In Progress with HR Review Note!) -->
  <g transform="translate(150, 190)">
    <rect width="1140" height="380" rx="20" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
    <g transform="translate(40, 30)">
      <g>
        <rect width="80" height="24" rx="12" fill="#FEF3C7" />
        <text x="40" y="16" class="font-sans" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">In Progress</text>
        <rect x="90" width="80" height="24" rx="12" fill="#FEE2E2" />
        <text x="130" y="16" class="font-sans" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">High Priority</text>
        <text x="185" y="17" class="font-sans" font-size="12" fill="#64748B">Due: 05 Oct 2026 • Assigned by: Alex Vance</text>
      </g>
      <text x="0" y="60" class="font-sans" font-size="20" font-weight="800" fill="#0F172A">TSK-101: Refactor Authentication State Management</text>
      <text x="0" y="85" class="font-sans" font-size="13" fill="#475569">
        Refactor the frontend session token store to support automated refresh cycles and graceful logout cleanup.
      </text>

      <!-- HR Review Notes Box (TASK 3 REQUIREMENT: Request changes sets to In Progress with HR notes!) -->
      <g transform="translate(0, 110)">
        <rect width="1060" height="60" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" />
        <text x="20" y="25" class="font-sans" font-size="12" font-weight="800" fill="#B45309">⚠️ HR Review Note (Alex Vance):</text>
        <text x="20" y="45" class="font-sans" font-size="13" fill="#78350F">"Please update the token expiry logic before re-submitting. Token refresh interval should be 15 minutes."</text>
      </g>

      <!-- Solution Submission Form (TASK 6: Summary box + optional link only, no file upload!) -->
      <g transform="translate(0, 190)">
        <text x="0" y="0" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">Submit Solution to HR</text>
        <text x="0" y="24" class="font-sans" font-size="12" font-weight="700" fill="#475569">Solution Summary</text>
        <rect y="34" width="700" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
        <text x="14" y="60" class="font-sans" font-size="13" fill="#0F172A">Updated JWT token storage and lifecycle handlers in auth.js with 15min refresh.</text>

        <text x="720" y="24" class="font-sans" font-size="12" font-weight="700" fill="#475569">Optional Deliverable URL</text>
        <rect x="720" y="34" width="340" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
        <text x="734" y="60" class="font-sans" font-size="13" fill="#2563EB">https://github.com/bridgeway/pull/42</text>

        <rect y="90" width="220" height="42" rx="10" fill="#2563EB" class="btn-shadow" />
        <text x="110" y="116" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Submit Solution to HR →</text>
      </g>
    </g>
  </g>

  <!-- Task 2: TSK-102 (Completed) -->
  <g transform="translate(150, 600)">
    <rect width="1140" height="240" rx="20" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
    <g transform="translate(40, 30)">
