        <text x="20" y="65" class="font-sans" font-size="28" font-weight="800" fill="#0F172A">4 Staff</text>
        <text x="20" y="90" class="font-sans" font-size="11" font-weight="500" fill="#3B82F6">● 3 Active, 1 On Leave</text>
