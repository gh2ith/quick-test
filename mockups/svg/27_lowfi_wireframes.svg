<svg width="1440" height="1800" viewBox="0 0 1440 1800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-mono { font-family: 'Courier New', monospace; }
      .wire-stroke { stroke: #4B5563; stroke-width: 1.5; }
      .wire-fill { fill: #F3F4F6; }
      .wire-text { fill: #1F2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="1440" height="1800" fill="#E5E7EB" />
  
  <!-- Sheet Title Banner -->
  <g transform="translate(60, 40)">
    <text x="0" y="32" class="wire-text" font-size="28" font-weight="800">LOW-FIDELITY SCHEMATIC WIREFRAME SPECIFICATION</text>
    <text x="0" y="58" class="wire-text" font-size="14" fill="#4B5563">Bridgeway HR Management System • Structural Layout Blueprints (Grayscale)</text>
  </g>

  <!-- Wireframe Grid: 6 Distinct System Blueprints -->

  <!-- 1. Guest Landing Page Blueprint -->
  <g transform="translate(60, 120)">
    <rect width="410" height="490" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="20" y="30" class="wire-text" font-size="14" font-weight="700">01. Guest Landing (Shared Hero + Journey)</text>
    
    <!-- Wireframe Nav -->
    <rect x="20" y="45" width="370" height="30" rx="4" fill="#F3F4F6" stroke="#D1D5DB" />
    <rect x="30" y="52" width="50" height="16" fill="#9CA3AF" />
    <rect x="180" y="56" width="30" height="8" fill="#D1D5DB" />
    <rect x="220" y="56" width="30" height="8" fill="#D1D5DB" />
    <rect x="260" y="56" width="40" height="8" fill="#D1D5DB" />
    <rect x="330" y="50" width="50" height="20" rx="4" fill="#4B5563" />

    <!-- Hero Box -->
    <rect x="20" y="85" width="370" height="120" rx="6" fill="#F9FAFB" stroke="#D1D5DB" />
    <line x1="20" y1="85" x2="390" y2="205" stroke="#E5E7EB" stroke-width="1" />
    <line x1="20" y1="205" x2="390" y2="85" stroke="#E5E7EB" stroke-width="1" />
    <rect x="35" y="105" width="160" height="14" fill="#4B5563" />
    <rect x="35" y="125" width="130" height="8" fill="#9CA3AF" />
    <rect x="35" y="145" width="80" height="24" rx="4" fill="#4B5563" />

    <!-- Journey Road Blueprint -->
    <g transform="translate(20, 215)">
      <rect width="370" height="160" rx="6" fill="#F9FAFB" stroke="#D1D5DB" />
      <path d="M40 80 Q100 30 180 80 T320 80" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="4 4" fill="none" />
      <circle cx="80" cy="55" r="10" fill="#4B5563" />
      <circle cx="180" cy="80" r="10" fill="#4B5563" />
      <circle cx="280" cy="80" r="10" fill="#4B5563" />
      <text x="185" y="145" class="wire-text" font-size="10" fill="#6B7280" text-anchor="middle">[Dynamic Fixed Road + Moving Traveler]</text>
    </g>

    <!-- Wireframe Footer -->
    <rect x="20" y="385" width="370" height="85" rx="6" fill="#374151" />
    <rect x="35" y="405" width="80" height="10" fill="#9CA3AF" />
    <rect x="35" y="422" width="100" height="6" fill="#6B7280" />
    <rect x="230" y="400" width="145" height="55" rx="4" fill="#1F2937" />
  </g>

  <!-- 2. Login Page Blueprint -->
  <g transform="translate(515, 120)">
    <rect width="410" height="490" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="20" y="30" class="wire-text" font-size="14" font-weight="700">02. Login Page (Auto-Role Redirect)</text>
    
    <!-- Wireframe Nav -->
    <rect x="20" y="45" width="370" height="30" rx="4" fill="#F3F4F6" stroke="#D1D5DB" />
    
    <!-- Centered Card -->
    <g transform="translate(55, 105)">
      <rect width="300" height="330" rx="8" fill="#F9FAFB" stroke="#9CA3AF" />
      <rect x="25" y="30" width="120" height="14" fill="#1F2937" />
      <rect x="25" y="50" width="200" height="8" fill="#9CA3AF" />
      
      <!-- Auto role banner -->
      <rect x="25" y="75" width="250" height="30" rx="4" fill="#E5E7EB" />
      <text x="150" y="94" class="wire-text" font-size="9" fill="#4B5563" text-anchor="middle">[Auto-Detect: HR or Employee]</text>
      
      <!-- Inputs -->
      <rect x="25" y="125" width="250" height="32" rx="4" fill="#FFFFFF" stroke="#D1D5DB" />
      <text x="35" y="145" class="wire-text" font-size="10" fill="#9CA3AF">Work Email</text>
      
      <rect x="25" y="175" width="250" height="32" rx="4" fill="#FFFFFF" stroke="#D1D5DB" />
      <text x="35" y="195" class="wire-text" font-size="10" fill="#9CA3AF">Password</text>
      
      <!-- Button -->
      <rect x="25" y="225" width="250" height="36" rx="6" fill="#1F2937" />
      <text x="150" y="247" class="wire-text" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sign In</text>

      <text x="150" y="290" class="wire-text" font-size="8" fill="#6B7280" text-anchor="middle">[No Public Registration - HR Provisioned]</text>
    </g>
  </g>

  <!-- 3. Employee Dashboard / Home Blueprint -->
  <g transform="translate(970, 120)">
    <rect width="410" height="490" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="20" y="30" class="wire-text" font-size="14" font-weight="700">03. Employee Home (SJ Session)</text>
    
    <!-- Employee Nav with SJ avatar -->
    <rect x="20" y="45" width="370" height="30" rx="4" fill="#F3F4F6" stroke="#D1D5DB" />
    <circle cx="330" cy="60" r="10" fill="#4B5563" />
    <rect x="345" y="53" width="35" height="14" rx="2" fill="#D1D5DB" />

    <!-- Shared Hero Layout -->
    <rect x="20" y="85" width="370" height="100" rx="6" fill="#F9FAFB" stroke="#D1D5DB" />
    <rect x="35" y="105" width="140" height="12" fill="#1F2937" />
    <rect x="35" y="125" width="180" height="8" fill="#9CA3AF" />

    <!-- 2 Column Widgets: Tasks + Meetings -->
    <g transform="translate(20, 200)">
      <!-- Left: My Tasks -->
      <rect width="180" height="170" rx="6" fill="#F9FAFB" stroke="#D1D5DB" />
      <rect x="15" y="15" width="80" height="10" fill="#4B5563" />
      <rect x="15" y="40" width="150" height="40" rx="4" fill="#FFFFFF" stroke="#E5E7EB" />
      <rect x="15" y="90" width="150" height="40" rx="4" fill="#FFFFFF" stroke="#E5E7EB" />
      
      <!-- Right: Upcoming Meetings (Jitsi) -->
      <g transform="translate(190, 0)">
        <rect width="180" height="170" rx="6" fill="#F9FAFB" stroke="#D1D5DB" />
        <rect x="15" y="15" width="100" height="10" fill="#4B5563" />
        <rect x="15" y="40" width="150" height="50" rx="4" fill="#FFFFFF" stroke="#E5E7EB" />
        <rect x="100" y="65" width="55" height="18" rx="3" fill="#4B5563" />
      </g>
    </g>

    <rect x="20" y="385" width="370" height="85" rx="6" fill="#374151" />
  </g>

  <!-- Row 2: HR Directory, Tasks Management, Jitsi Meeting Room -->

  <!-- 4. HR Employee Directory Blueprint -->
  <g transform="translate(60, 640)">
    <rect width="410" height="520" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="20" y="30" class="wire-text" font-size="14" font-weight="700">04. HR Employee Directory &amp; Administration</text>
    
    <rect x="20" y="45" width="370" height="30" rx="4" fill="#F3F4F6" stroke="#D1D5DB" />
    <rect x="280" y="85" width="110" height="26" rx="4" fill="#1F2937" />
    <text x="335" y="102" class="wire-text" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Add Employee</text>

    <!-- Search bar -->
    <rect x="20" y="120" width="370" height="32" rx="4" fill="#F9FAFB" stroke="#D1D5DB" />
    <text x="32" y="140" class="wire-text" font-size="10" fill="#9CA3AF">Search &amp; Filter...</text>

    <!-- Table -->
    <g transform="translate(20, 165)">
      <rect width="370" height="230" rx="6" fill="#FFFFFF" stroke="#D1D5DB" />
      <rect width="370" height="28" fill="#F3F4F6" />
      <text x="12" y="18" class="wire-text" font-size="9" font-weight="700">NAME / EMAIL</text>
      <text x="130" y="18" class="wire-text" font-size="9" font-weight="700">DEPT</text>
      <text x="220" y="18" class="wire-text" font-size="9" font-weight="700">STATUS</text>
      <text x="300" y="18" class="wire-text" font-size="9" font-weight="700">ACTIONS</text>

      <!-- Row 1 -->
      <line x1="0" y1="65" x2="370" y2="65" stroke="#E5E7EB" />
      <circle cx="20" cy="46" r="10" fill="#9CA3AF" />
      <rect x="36" y="40" width="70" height="8" fill="#1F2937" />
      <rect x="300" y="38" width="28" height="18" rx="2" fill="#E5E7EB" />
      <rect x="332" y="38" width="28" height="18" rx="2" fill="#E5E7EB" />

      <!-- Row 2 -->
      <line x1="0" y1="105" x2="370" y2="105" stroke="#E5E7EB" />
      <circle cx="20" cy="85" r="10" fill="#9CA3AF" />
      <rect x="36" y="80" width="70" height="8" fill="#1F2937" />
      <rect x="300" y="78" width="28" height="18" rx="2" fill="#E5E7EB" />
      <rect x="332" y="78" width="28" height="18" rx="2" fill="#E5E7EB" />
    </g>

    <!-- Modal Callout Blueprint -->
    <g transform="translate(180, 270)">
      <rect width="210" height="140" rx="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5" />
      <text x="15" y="24" class="wire-text" font-size="10" font-weight="700">[Modal: Edit / Add Employee]</text>
      <rect x="15" y="38" width="180" height="18" rx="2" fill="#F3F4F6" />
      <rect x="15" y="62" width="180" height="18" rx="2" fill="#F3F4F6" />
      <rect x="15" y="95" width="80" height="22" rx="3" fill="#D1D5DB" />
      <rect x="105" y="95" width="90" height="22" rx="3" fill="#1F2937" />
    </g>

    <!-- HR Footer (No feedback form) -->
    <rect x="20" y="425" width="370" height="75" rx="6" fill="#1F2937" />
  </g>

  <!-- 5. Task Management & Solution Review Blueprint -->
  <g transform="translate(515, 640)">
    <rect width="410" height="520" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="20" y="30" class="wire-text" font-size="14" font-weight="700">05. Task Board &amp; HR Review Loop</text>
    
    <rect x="20" y="45" width="370" height="30" rx="4" fill="#F3F4F6" stroke="#D1D5DB" />
    
    <!-- 3 Kanban Columns Blueprint -->
    <g transform="translate(20, 95)">
      <!-- Col 1 -->
      <rect width="116" height="300" rx="6" fill="#F9FAFB" stroke="#D1D5DB" />
      <text x="12" y="20" class="wire-text" font-size="9" font-weight="700">Pending (1)</text>
      <rect x="8" y="30" width="100" height="80" rx="4" fill="#FFFFFF" stroke="#E5E7EB" />
      
      <!-- Col 2 -->
      <g transform="translate(126, 0)">
        <rect width="116" height="300" rx="6" fill="#F9FAFB" stroke="#D1D5DB" />
        <text x="12" y="20" class="wire-text" font-size="9" font-weight="700">In Progress (2)</text>
        <rect x="8" y="30" width="100" height="95" rx="4" fill="#FFFFFF" stroke="#E5E7EB" />
        <rect x="12" y="90" width="35" height="16" rx="2" fill="#E5E7EB" />
        <rect x="52" y="90" width="45" height="16" rx="2" fill="#E5E7EB" />
      </g>

      <!-- Col 3 -->
      <g transform="translate(252, 0)">
        <rect width="116" height="300" rx="6" fill="#F9FAFB" stroke="#D1D5DB" />
        <text x="12" y="20" class="wire-text" font-size="9" font-weight="700">Completed (1)</text>
        <rect x="8" y="30" width="100" height="80" rx="4" fill="#FFFFFF" stroke="#E5E7EB" />
      </g>
    </g>

    <!-- Task Review Dialog Callout -->
    <g transform="translate(80, 280)">
      <rect width="250" height="130" rx="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5" />
      <text x="15" y="22" class="wire-text" font-size="10" font-weight="700">[HR Task Review: Approve / Changes]</text>
      <text x="15" y="42" class="wire-text" font-size="8" fill="#6B7280">Reviewer Notes: "Update token expiry..."</text>
      <rect x="15" y="55" width="220" height="30" rx="3" fill="#F3F4F6" />
      <rect x="15" y="94" width="95" height="24" rx="3" fill="#D1D5DB" />
      <text x="62" y="110" class="wire-text" font-size="8" font-weight="700" text-anchor="middle">Request Changes</text>
      <rect x="120" y="94" width="115" height="24" rx="3" fill="#1F2937" />
      <text x="177" y="110" class="wire-text" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">Approve Task</text>
    </g>

    <rect x="20" y="425" width="370" height="75" rx="6" fill="#1F2937" />
  </g>

  <!-- 6. Embedded Jitsi Video Meeting Room Blueprint -->
  <g transform="translate(970, 640)">
    <rect width="410" height="520" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="20" y="30" class="wire-text" font-size="14" font-weight="700">06. Jitsi Meeting Room (Responsive Full-Width)</text>
    
    <!-- Dark room header -->
    <rect x="20" y="45" width="370" height="30" rx="4" fill="#1F2937" />
    <text x="32" y="64" class="wire-text" font-size="9" fill="#9CA3AF">Sprint Planning &amp; Review • LIVE 00:24:18</text>
    <rect x="320" y="50" width="60" height="20" rx="4" fill="#991B1B" />
    <text x="350" y="64" class="wire-text" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">Leave Call</text>

    <!-- Video Canvas Wireframe -->
    <g transform="translate(20, 85)">
      <rect width="370" height="320" rx="6" fill="#111827" />
      <!-- Main presentation box -->
      <rect x="10" y="10" width="260" height="250" rx="4" fill="#1F2937" stroke="#374151" />
      <line x1="10" y1="10" x2="270" y2="260" stroke="#374151" />
      <line x1="10" y1="260" x2="270" y2="10" stroke="#374151" />
      <text x="140" y="140" class="wire-text" font-size="10" fill="#9CA3AF" text-anchor="middle">[Active Speaker / Screen Share Feed]</text>

      <!-- Thumbnails -->
      <rect x="280" y="10" width="80" height="75" rx="4" fill="#1F2937" />
      <text x="320" y="52" class="wire-text" font-size="8" fill="#9CA3AF" text-anchor="middle">[SJ - Mic On]</text>

      <rect x="280" y="95" width="80" height="75" rx="4" fill="#1F2937" />
      <text x="320" y="137" class="wire-text" font-size="8" fill="#9CA3AF" text-anchor="middle">[DM - Mute]</text>

      <rect x="280" y="180" width="80" height="75" rx="4" fill="#1F2937" />
      <text x="320" y="222" class="wire-text" font-size="8" fill="#9CA3AF" text-anchor="middle">[MS - Mute]</text>

      <!-- Floating Controls Bar -->
      <rect x="100" y="275" width="170" height="32" rx="16" fill="#1F2937" stroke="#4B5563" />
      <circle cx="120" cy="291" r="9" fill="#374151" />
      <circle cx="145" cy="291" r="9" fill="#374151" />
      <circle cx="170" cy="291" r="9" fill="#4B5563" />
      <circle cx="195" cy="291" r="9" fill="#374151" />
      <rect x="215" y="281" width="45" height="20" rx="10" fill="#991B1B" />
    </g>

    <rect x="20" y="425" width="370" height="75" rx="6" fill="#1F2937" />
  </g>

  <!-- Summary Box at Bottom -->
  <g transform="translate(60, 1200)">
    <rect width="1320" height="150" rx="10" fill="#FFFFFF" stroke="#9CA3AF" />
    <g transform="translate(30, 30)">
      <text x="0" y="20" class="wire-text" font-size="16" font-weight="800">Bridgeway HR System Architecture Contract Summary</text>
      <text x="0" y="44" class="wire-text" font-size="12" fill="#4B5563">1. Locked Navbar Contract: Reused across all pages with role-specific menu items and profile pill.</text>
      <text x="0" y="66" class="wire-text" font-size="12" fill="#4B5563">2. Single Dataset Consistency: Sarah Jenkins (#EMP-2041, Frontend Engineer), Alex Vance (#HR-1001, HR Director), Michael Scott, David Miller.</text>
      <text x="0" y="88" class="wire-text" font-size="12" fill="#4B5563">3. Integrated Jitsi Video Bridge: Embedded room experience with auto-generated URLs replacing legacy external Zoom.</text>
    </g>
  </g>
</svg>